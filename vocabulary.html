<section id="home"><div class="hero"><div><div class="eyebrow">LINEAR ALGEBRA · EXAM VOCABULARY</div><h1>读懂题目，<br>再开始计算。</h1><p class="muted">看英文，选择对应的中文。每题提交后立即判分，<br>把容易看错的词，变成考场上熟悉的词。</p></div><div class="numbers"><div><span class="big">138</span><small>词汇与表达</small></div><div><span class="big">8</span><small>主题分组</small></div></div></div><div class="card"><div class="grid"><div class="field"><label for="group">测试范围</label><select id="group"><option value="core">教材 + Tut 核心词汇（122 组）</option><option value="all">全部词汇（含期末拓展）</option></select></div><div class="field"><label for="count">本轮题量</label><select id="count"><option value="20">20 题 · 快速自测</option><option value="40">40 题 · 集中巩固</option><option value="0">所选范围全部</option></select></div></div><label class="check"><input id="star" type="checkbox">只测 Word 中标 ★ 的重点词</label><div id="poolInfo" class="foot"></div><div class="actions"><button id="start" class="btn primary">开始自测 →</button><button id="resume" class="btn" hidden>继续上次测试</button><button id="wrongStart" class="btn" hidden>错词重练</button></div><p id="homeMessage" class="muted" role="status"></p></div><p class="foot">词库来自刚才的考前 Word，释义遵循你的教材与 Tut。每题选最完整、对应顺序一致的中文释义。进度仅保存在当前浏览器。</p></section>

const WORDS=[{"id": 0, "en": "find / determine", "zh": "求出或确定", "note": "determine the values of λ：确定参数取值，常需分类。", "group": "题目指令", "star": true}, {"id": 1, "en": "calculate / compute / evaluate", "zh": "计算", "note": "evaluate a sum：求和的值；compute a product：计算乘积。", "group": "题目指令", "star": true}, {"id": 2, "en": "express ... in terms of ...", "zh": "用……表示……", "note": "express a in terms of u and v：最后用 u 和 v 写答案。", "group": "题目指令", "star": true}, {"id": 3, "en": "resolve ... into ...", "zh": "把……分解为……", "note": "resolve a vector into two components：把向量拆成两部分。", "group": "题目指令", "star": true}, {"id": 4, "en": "show that / prove that", "zh": "证明……", "note": "给出理由或推导，不能只把结论抄一遍。", "group": "题目指令", "star": true}, {"id": 5, "en": "verify that", "zh": "验证……", "note": "用计算、代入或恒等变形确认结论成立。", "group": "题目指令", "star": false}, {"id": 6, "en": "hence / deduce", "zh": "由此 / 推出", "note": "hence find：利用上一问结果继续求，不必重新开始。", "group": "题目指令", "star": true}, {"id": 7, "en": "write down / state", "zh": "直接写出 / 陈述", "note": "通常写结论即可；仍应遵守题目说明。", "group": "题目指令", "star": false}, {"id": 8, "en": "simplify", "zh": "化简", "note": "整理同类项或把表达式写得更简洁。", "group": "题目指令", "star": false}, {"id": 9, "en": "solve the system", "zh": "解这个方程组", "note": "要给出所有解；有自由变量时写参数解。", "group": "题目指令", "star": true}, {"id": 10, "en": "give a very brief reason", "zh": "给出非常简短的理由", "note": "一两句关键原因，避免只回答 yes 或 no。", "group": "题目指令", "star": false}, {"id": 11, "en": "interpret ... geometrically", "zh": "从几何角度解释", "note": "把代数结果解释成长度、方向、垂直或交集。", "group": "题目指令", "star": false}, {"id": 12, "en": "assign / let / set", "zh": "令 / 设", "note": "by assigning z=t：令 z=t，再表达其他未知数。", "group": "题目指令", "star": true}, {"id": 13, "en": "match / matching descriptions", "zh": "配对 / 对应描述", "note": "可能是同一直线或平面的不同写法。", "group": "题目指令", "star": false}, {"id": 14, "en": "select / choose the correct option", "zh": "选择正确选项", "note": "注意紧随其后的 TRUE、FALSE、ONE 等限定。", "group": "题目指令", "star": true}, {"id": 15, "en": "true / false", "zh": "正确 / 错误", "note": "Which statement is FALSE?：选错误陈述，别选正确项。", "group": "逻辑限定词", "star": true}, {"id": 16, "en": "ONE correct option", "zh": "只有一个正确选项", "note": "单项选择。ONE 是数量限制。", "group": "逻辑限定词", "star": true}, {"id": 17, "en": "not / never / cannot", "zh": "不 / 从不 / 不可能", "note": "can never be inconsistent：不可能无解。", "group": "逻辑限定词", "star": true}, {"id": 18, "en": "not necessarily", "zh": "不一定", "note": "不是“必定不”；表示结论并非总成立。", "group": "逻辑限定词", "star": true}, {"id": 19, "en": "if and only if / iff", "zh": "当且仅当", "note": "两个方向都成立，即充要条件。", "group": "逻辑限定词", "star": true}, {"id": 20, "en": "if / only if", "zh": "如果 / 只有……才", "note": "A if B：B 推出 A；A only if B：A 推出 B。", "group": "逻辑限定词", "star": false}, {"id": 21, "en": "for all / for any / every", "zh": "对所有 / 任意 / 每一个", "note": "全称条件；一个反例就能否定“对所有成立”。", "group": "逻辑限定词", "star": true}, {"id": 22, "en": "there exists / some", "zh": "存在 / 某个或某些", "note": "there exists a scalar：至少能找到一个数。", "group": "逻辑限定词", "star": false}, {"id": 23, "en": "at least / at most", "zh": "至少 / 至多", "note": "at least one：一个或更多；at most one：零个或一个。", "group": "逻辑限定词", "star": true}, {"id": 24, "en": "exactly / only", "zh": "恰好 / 仅仅", "note": "exactly one solution：恰好一个解。", "group": "逻辑限定词", "star": false}, {"id": 25, "en": "nonzero / non-zero", "zh": "非零的", "note": "a nonzero vector：不是零向量。", "group": "逻辑限定词", "star": true}, {"id": 26, "en": "not all zero", "zh": "不全为零", "note": "至少一个不为零；不是“每一个都不为零”。", "group": "逻辑限定词", "star": true}, {"id": 27, "en": "both ... and ...", "zh": "两者都……", "note": "perpendicular to both v and w：同时垂直于两个向量。", "group": "逻辑限定词", "star": false}, {"id": 28, "en": "respectively / corresponding", "zh": "分别 / 对应的", "note": "a,b correspond to x,y respectively：按顺序一一对应。", "group": "逻辑限定词", "star": false}, {"id": 29, "en": "such that / satisfying", "zh": "使得 / 满足", "note": "给出必须同时满足的条件，不能忽略从句。", "group": "逻辑限定词", "star": false}, {"id": 30, "en": "suppose / assume / given that", "zh": "设 / 假设 / 已知", "note": "引入题目条件；不是需要你证明的结论。", "group": "逻辑限定词", "star": false}, {"id": 31, "en": "holds / equality occurs", "zh": "成立 / 等号成立", "note": "determine when equality occurs：找取等号的条件。", "group": "逻辑限定词", "star": false}, {"id": 32, "en": "to the nearest degree / km", "zh": "四舍五入到整度 / 整公里", "note": "nearest degree：最终角度通常保留整数度。", "group": "逻辑限定词", "star": false}, {"id": 33, "en": "vector / scalar", "zh": "向量 / 标量", "note": "vector 有大小和方向；scalar 是数。", "group": "向量与集合", "star": true}, {"id": 34, "en": "magnitude / norm / length", "zh": "大小 / 范数 / 长度", "note": "对本课程的几何向量，这三个词常指同一个长度。", "group": "向量与集合", "star": true}, {"id": 35, "en": "unit vector / normalize", "zh": "单位向量 / 单位化", "note": "长度为 1；求单位向量时用原向量除以其长度。", "group": "向量与集合", "star": true}, {"id": 36, "en": "position vector", "zh": "位置向量", "note": "从原点指向一个点。", "group": "向量与集合", "star": true}, {"id": 37, "en": "displacement vector", "zh": "位移向量", "note": "from A to B：终点 B 减起点 A。", "group": "向量与集合", "star": true}, {"id": 38, "en": "component / Cartesian form", "zh": "分量 / 笛卡尔形式", "note": "可指坐标分量，或用 i、j、k 表示向量。", "group": "向量与集合", "star": false}, {"id": 39, "en": "direction / pointing towards", "zh": "方向 / 指向", "note": "pointing from B towards A：方向由 B 指向 A。", "group": "向量与集合", "star": false}, {"id": 40, "en": "parallel / antiparallel", "zh": "平行 / 反向平行", "note": "平行非零向量成比例；反向对应负比例。", "group": "向量与集合", "star": true}, {"id": 41, "en": "zero vector / negative vector", "zh": "零向量 / 相反向量", "note": "相反向量长度相等，方向相反。", "group": "向量与集合", "star": false}, {"id": 42, "en": "linear combination", "zh": "线性组合", "note": "若干向量分别数乘后相加。", "group": "向量与集合", "star": true}, {"id": 43, "en": "linearly independent", "zh": "线性无关", "note": "只能用全零系数组合得到零向量。", "group": "向量与集合", "star": true}, {"id": 44, "en": "linearly dependent", "zh": "线性相关", "note": "存在不全为零的系数，使组合为零向量。", "group": "向量与集合", "star": true}, {"id": 45, "en": "span / subspace", "zh": "张成 / 子空间", "note": "span 表示所有线性组合能到达的集合。", "group": "向量与集合", "star": false}, {"id": 46, "en": "midpoint / divide in the ratio", "zh": "中点 / 按比例分点", "note": "di const KEY='linear-vocab-quiz-v1';const $=id=>document.getElementById(id);let saved={wrong:[],round:null},round=null;

const valid=id=>Number.isInteger(id)&&WORDS[id];saved.wrong=saved.wrong.filter(valid);
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved));}catch{}}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function show(id){for(const x of ['home','quiz','results'])$(x).hidden=x!==id;window.scrollTo(0,0);}
for(const g of [...new Set(WORDS.map(w=>w.group))]){const o=document.createElement('option');o.value=g;o.textContent=g;$('group').append(o);}
function pool(){return WORDS.filter(w=>($('group').value==='all'||($('group').value==='core'?w.group!=='期末拓展':w.group===$('group').value))&&(!$('star').checked||w.star));}
function home(){show('home');const p=pool();$('poolInfo').textContent=`当前范围：${p.length} 组词汇${$('star').checked?' · 仅重点词':''}`;$('start').disabled=!p.length;$('resume').hidden=!(saved.round&&saved.round.pos<saved.round.items.length);$('wrongStart').hidden=!saved.wrong.length;$('wrongStart').textContent=`错词重练（${saved.wrong.length}）`;}
function optionsFor(w){const used=new Set([w.zh]);const distract=[];const candidates=[...shuffle(WORDS.filter(x=>x.group===w.group&&x.id!==w.id)),...shuffle(WORDS.filter(x=>x.id!==w.id))];for(const x of candidates){if(!used.has(x.zh)){used.add(x.zh);distract.push(x.id);}if(distract.length===3)break;}return shuffle([w.id,...distract]);}
function start(ids){round={items:shuffle(ids).map(id=>({id,options:optionsFor(WORDS[id]),selected:null,graded:false})),pos:0};saved.round=round;persist();render();}
function current(){return round.items[round.pos];}
function render(){show('quiz');const q=current(),w=WORDS[q.id];$('progressText').textContent=`第 ${round.pos+1} / ${round.items.length} 题`;$('fill').style.width=(round.pos/round.items.length*100)+'%';$('topic').textContent=w.group+(w.star?' · ★ 重点':'');const answered=round.items.filter(x=>x.graded),correct=answered.filter(x=>x.selected===x.id);$('liveScore').textContent=`答对 ${correct.length} / 已答 ${answered.length}`;$('question').textContent=w.en;$('options').replaceChildren();q.options.forEach((id,i)=>{const b=document.createElement('button');b.className='option';b.disabled=q.graded;b.setAttribute('aria-pressed',q.selected===id?'true':'false');const l=document.createElement('span');l.className='letter';l.textContent=String.fromCharCode(65+i);const t=document.createElement('span');t.textContent=WORDS[id].zh;b.append(l,t);if(q.graded&&id===q.id)b.classList.add('correct');else if(q.graded&&id===q.selected)b.classList.add('incorrect');else if(id===q.selected)b.classList.add('chosen');b.onclick=()=>{q.selected=id;persist();render();};$('options').append(b);});$('submit').hidden=q.graded;$('submit').disabled=q.selected===null;$('next').hidden=!q.graded;$('next').textContent=round.pos===round.items.length-1?'查看本轮结果 →':'下一题 →';$('feedback').hidden=!q.graded;if(q.graded){const ok=q.selected===q.id;$('feedback').className='feedback'+(ok?'':' bad');$('feedback').replaceChildren();const h=document.createElement('strong');h.textContent=ok?'✓ 回答正确':'✕ 这组需要再记一下';const a=document.createElement('p');a.textContent=`${w.en} → ${w.zh}`;const n=document.createElement('p');n.textContent=w.note;$('feedback').append(h,a,n);}}
function submit(){const q=current();if(q.graded||q.selected===null)return;q.graded=true;if(q.selected!==q.id){if(!saved.wrong.includes(q.id))saved.wrong.push(q.id);}else saved.wrong=saved.wrong.filter(id=>id!==q.id);persist();render();$('next').focus();}
function finish(){show('results');const wrong=round.items.filter(q=>q.selected!==q.id),good=round.items.length-wrong.length;$('resultScore').textContent=Math.round(good/round.items.length*100)+'%';$('resultText').textContent=`共 ${round.items.length} 题，答对 ${good} 题，答错 ${wrong.length} 题。`;$('retry').hidden=!wrong.length;$('retry').onclick=()=>start(wrong.map(q=>q.id));$('review').replaceChildren();const h=document.createElement('h2');h.textContent=wrong.length?'本轮错词 · 点击展开解析':'全部答对，继续保持。';$('review').append(h);wrong.forEach(q=>{const w=WORDS[q.id],d=document.createElement('details'),s=document.createElement('summary'),a=document.createElement('p'),n=document.createElement('p');s.textContent=w.en;a.textContent=`正确：${w.zh}；你的选择：${WORDS[q.selected].zh}`;n.textContent=w.note;d.append(s,a,n);$('review').append(d);});persist();}
$('group').onchange=home;$('star').onchange=home;$('start').onclick=()=>{let p=shuffle(pool());const n=Number($('count').value);if(n)p=p.slice(0,n);start(p.map(w=>w.id));};$('resume').onclick=()=>{round=saved.round;render();};$('wrongStart').onclick=()=>start(saved.wrong);$('back').onclick=home;$('submit').onclick=submit;$('next').onclick=()=>{round.pos++;persist();if(round.pos>=round.items.length)finish();else render();};$('restart').onclick=home;
document.addEventListener('keydown',e=>{if($('quiz').hidden||e.altKey||e.ctrlKey||e.metaKey||e.repeat)return;const q=current();if(/^[1-4]$/.test(e.key)&&!q.graded){e.preventDefault();q.selected=q.options[Number(e.key)-1];persist();render();}else if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();if(q.graded)$('next').click();else submit();}});home();
</script></body></html>
